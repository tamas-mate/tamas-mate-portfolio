<!doctype html>
<html lang="en" class="scroll-smooth">
	<head>
		<meta charset="UTF-8" />
		<script>
			const currentPreference = localStorage.getItem("theme") ?? "system";
			const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;

			if (currentPreference === "dark" || (currentPreference === "system" && prefersDark)) {
				document.documentElement.classList.add("dark");
			}
		</script>
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta
			name="description"
			content="Portfolio of Tamás Máté, a web developer specializing in React, TypeScript, Tailwind CSS. Showcasing projects, skills, and experience."
		/>
		<style>
			body {
				margin: 0;
			}

			.startup-splash {
				display: flex;
				flex-direction: column;
				gap: 1rem;
				align-items: center;
				justify-content: center;
				height: 100vh;
				background-color: #f3f5f7;
				color: #121212;
				font-family: system-ui, sans-serif;
			}

			.startup-splash__spinner {
				box-sizing: border-box;
				width: 5rem;
				height: 5rem;
				border-top: 4px solid #3983fa;
				border-bottom: 4px solid #3983fa;
				border-radius: 50%;
				animation: startup-spin 1s linear infinite;
			}

			.startup-splash__status {
				margin: 0;
				font-size: 1rem;
				line-height: 1.5;
			}

			html.dark .startup-splash {
				background-color: #121212;
				color: #ffffff;
			}

			html.dark .startup-splash__spinner {
				border-top: 4px solid #48e5c2;
				border-bottom: 4px solid #48e5c2;
			}

			@keyframes startup-spin {
				to {
					transform: rotate(360deg);
				}
			}

			@media (prefers-reduced-motion: reduce) {
				.startup-splash__spinner {
					animation: none;
				}
			}
		</style>
	</head>

	<body>
		<div id="root">
			<div class="startup-splash" role="status">
				<div class="startup-splash__spinner" aria-hidden="true"></div>
				<p class="startup-splash__status">Loading portfolio…</p>
			</div>
		</div>
		<script>
			(function localizeStartupSplash() {
				const messages = {
					en: "Loading portfolio…",
					hu: "Portfólió betöltése…",
					ro: "Se încarcă portofoliul…",
				};

				let language = "en";

				try {
					const userLocale = localStorage.getItem("i18nextLng");

					if (Object.hasOwn(messages, userLocale)) {
						language = userLocale;
					}
				} catch (error) {
					console.error(error);
				}

				document.documentElement.lang = language;

				const status = document.querySelector(".startup-splash__status");

				if (status) {
					status.textContent = messages[language];
				}
			})();
		</script>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
